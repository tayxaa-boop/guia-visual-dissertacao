<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 135 2048 866" role="img" aria-labelledby="titulo descricao">
<title id="titulo">Zoom metodológico | como a matriz foi construída</title>
<desc id="descricao">Sequência a defender: problema da pesquisa, três perguntas, dimensões, operações documentais e interpretações fundamentadas. Três dimensões: epistemológico-metodológica; ontológico-psicológica; pedagógico-político-educacional. Unidade de análise: lógica interna da explicação. Cinco movimentos articulados: reconstrução interna, interrogação analítica, registro das mediações, confronto crítico e síntese provisória. Registro documental: E explicitação, M menção, I inferência fundamentada, NI não identificável, A ausência verificada e T tensão interna. Teste exploratório: Soares 2018, escolha profissional; Bueno 2018, Papo Jovem. Duas aplicações não permitem identificar tendências nacionais.</desc>
<rect width="2048" height="1001" fill="#fff"/>



<rect x="14" y="141" width="663" height="274" fill="#e6f2f4" stroke="#d5deeb" stroke-width="2"/>
<text x="30" y="188" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203d5b">1 · COMO CONHECEMOS?</text>
<text x="30" y="235" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#203d5b">EPISTEMOLÓGICO-METODOLÓGICA</text>
<text x="30" y="282" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#1e344e">Problema • pressupostos • procedimento • evidência •</text>
<text x="30" y="310" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#1e344e">conclusão</text>
<text x="30" y="354" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#617084">Marx (2011); Sánchez Gamboa (2018); Tello (2012)</text>
<rect x="694" y="141" width="663" height="274" fill="#ecf3f9" stroke="#d5deeb" stroke-width="2"/>
<text x="710" y="188" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203d5b">2 · O QUE É EXPLICADO?</text>
<text x="710" y="235" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#203d5b">ONTOLÓGICO-PSICOLÓGICA</text>
<text x="710" y="282" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#1e344e">Adolescência • constituição do psiquismo • atividade •</text>
<text x="710" y="310" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#1e344e">apropriação • pensamento</text>
<text x="710" y="354" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#617084">Vigotski (1995, 1996); Leontiev (2021); Martins (2013a);</text>
<text x="710" y="382" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#617084">Anjos (2017)</text>
<rect x="1374" y="141" width="663" height="274" fill="#ebf1e9" stroke="#d5deeb" stroke-width="2"/>
<text x="1390" y="188" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203d5b">3 · QUAL A FUNÇÃO DA ESCOLA?</text>
<text x="1390" y="235" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#203d5b">PEDAGÓGICO-POLÍTICO-EDUCACIONAL</text>
<text x="1390" y="282" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#1e344e">Ensino • conhecimentos • trabalho educativo • condições</text>
<text x="1390" y="310" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#1e344e">institucionais e políticas</text>
<text x="1390" y="354" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#617084">Saviani (2011); Duarte (2016); Lavoura e Martins (2017)</text>
<text x="30" y="442" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#28466d">NÚCLEO: unidade de análise = lógica interna da explicação. Não são classes de estudos, escala de qualidade ou checklist obrigatório.</text>
<text x="29" y="495" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#28466d">CINCO MOVIMENTOS</text>
<text x="336" y="495" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536b80">(articulados, com possibilidade de retorno)</text>
<rect x="14" y="517" width="396" height="170" fill="#eff3f7" stroke="#d5deeb" stroke-width="2"/>
<text x="28" y="556" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#203d5b">I  Reconstrução interna</text>
<text x="28" y="601" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#20344b">Compreender os autores nos seus</text>
<text x="28" y="629" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#20344b">próprios termos.</text>
<rect x="410" y="517" width="396" height="170" fill="#fff" stroke="#d5deeb" stroke-width="2"/>
<text x="424" y="556" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#203d5b">II  Interrogação analítica</text>
<text x="424" y="601" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#20344b">Perguntar o que é pertinente ao</text>
<text x="424" y="629" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#20344b">objeto.</text>
<rect x="806" y="517" width="416" height="170" fill="#eff3f7" stroke="#d5deeb" stroke-width="2"/>
<text x="820" y="556" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#203d5b">III  Registro das mediações</text>
<text x="820" y="601" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#20344b">Documentar relações, excertos,</text>
<text x="820" y="629" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#20344b">páginas e estados.</text>
<rect x="1222" y="517" width="416" height="170" fill="#fff" stroke="#d5deeb" stroke-width="2"/>
<text x="1236" y="556" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#203d5b">IV  Confronto crítico</text>
<text x="1236" y="601" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#20344b">Examinar coerência e alcance das</text>
<text x="1236" y="629" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#20344b">inferências.</text>
<rect x="1638" y="517" width="396" height="170" fill="#eff3f7" stroke="#d5deeb" stroke-width="2"/>
<text x="1652" y="556" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#203d5b">V  Síntese provisória</text>
<text x="1652" y="601" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#20344b">Reconstituir a unidade da</text>
<text x="1652" y="629" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#20344b">explicação e os limites.</text>
<text x="29" y="722" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536b80">REGISTRO DOCUMENTAL: E = explicitação  •  M = menção  •  I = inferência fundamentada  •  NI = não identificável  •  A = ausência verificada  •  T = tensão interna (transversal).</text>
<text x="29" y="777" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#203d5b">TESTE EXPLORATÓRIO</text>
<text x="381" y="777" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#536b80">(Soares, 2018; Bueno, 2018)</text>
<rect x="14" y="793" width="1010" height="154" fill="#f0edf6" stroke="#d5deeb" stroke-width="2"/>
<rect x="1024" y="793" width="1010" height="154" fill="#faf1e7" stroke="#d5deeb" stroke-width="2"/>
<text x="29" y="837" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203d5b">SOARES (2018)  •  ESCOLHA PROFISSIONAL</text>
<text x="29" y="877" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#1e3048">32 de 54 estudantes admitem alterar preferência em cenário hipotético. Isso não</text>
<text x="29" y="904" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#1e3048">demonstra mudança efetiva de curso nem causalidade isolada da oferta.</text>
<text x="1040" y="837" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#203d5b">BUENO (2018)  •  PAPO JOVEM</text>
<text x="1040" y="877" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#1e3048">Mudança na grade e no material permitiu aulas de educação sexual. Isso demonstra</text>
<text x="1040" y="903" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#1e3048">condições de institucionalização, não necessariamente aprendizagem ou</text>
<text x="1040" y="929" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#1e3048">desenvolvimento psíquico.</text>
<text x="29" y="982" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#203d5b">FECHO</text>
<text x="130" y="982" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#22364f">A matriz já mostrou possibilidades de operacionalização, mas duas aplicações não permitem identificar tendências nacionais.</text>
</svg>