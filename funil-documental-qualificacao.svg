<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="930" viewBox="0 0 1200 930" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="titulo descricao">
<title id="titulo">Funil documental — dados e percurso de triagem</title>
<desc id="descricao">Representação visual do fluxo documental: 1.543 ocorrências brutas do levantamento 2017 a 2025; 875 documentos únicos do subconjunto 2018 a 2025; 563 encaminhados à avaliação integral; duas dissertações usadas exclusivamente para o exercício exploratório. Os quantitativos pertencem a unidades e recortes diferentes; o teste com duas dissertações não é uma quarta fase de elegibilidade. Fundo transparente, desenho vetorial e tipografia Arial.</desc>
<defs>
