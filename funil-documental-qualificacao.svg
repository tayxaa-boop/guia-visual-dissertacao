<linearGradient id="luz" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#93a6b6" stop-opacity=".65"/><stop offset="1" stop-color="#233c59" stop-opacity=".25"/></linearGradient>
<filter id="sombra" x="-15%" y="-20%" width="135%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#142d46" flood-opacity=".18"/></filter>
</defs>
